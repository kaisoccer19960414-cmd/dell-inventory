<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規商品登録 - Dell</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 60px; background: #f7f7f7; }
        .box { background: #fff; padding: 32px; border-radius: 8px; width: 340px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        h1 { font-size: 18px; margin-top: 0; }
        .note { font-size: 12px; color: #666; margin-bottom: 16px; }
        input { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007db8; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 8px; }
        .error { color: #c0392b; font-size: 12px; margin: 0 0 8px; }
        a { font-size: 13px; }
    </style>
</head>
<body>
<div class="box">
    <h1>新規商品登録</h1>
    <p class="note">登録すると商品IDが自動採番され、同時にAmazon側へも自動的に反映されます。</p>

    <form method="post" th:action="@{/products/new}" th:object="${createProductRequest}">
        <input type="text" th:field="*{name}" placeholder="商品名">
        <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <input type="number" th:field="*{price}" placeholder="価格(円)">
        <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>

        <input type="number" th:field="*{stock}" placeholder="在庫数">
        <p class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>

        <button type="submit">登録する</button>
    </form>

    <p><a th:href="@{/products}">商品一覧へ戻る</a></p>
</div>
</body>
</html>
