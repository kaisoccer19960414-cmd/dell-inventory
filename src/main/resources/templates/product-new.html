<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規商品登録 - Dell</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 40px; background: #f7f7f7; }
        .box { background: #fff; padding: 32px; border-radius: 8px; width: 360px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        h1 { font-size: 18px; margin-top: 0; }
        .category-badge { display: inline-block; background: #007db8; color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 4px; margin-bottom: 12px; }
        .note { font-size: 12px; color: #666; margin-bottom: 16px; }
        label { font-size: 12px; color: #444; display: block; margin-top: 8px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007db8; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 16px; }
        button:disabled { background: #999; cursor: not-allowed; }
        .error { color: #c0392b; font-size: 12px; margin: 0 0 8px; }
        .spec-fields { border-top: 1px solid #eee; margin-top: 12px; padding-top: 8px; }
        a { font-size: 13px; }
    </style>
</head>
<body>
<div class="box">
    <span class="category-badge" th:text="${category}"></span>
    <h1>新規商品登録</h1>
    <p class="note">登録すると商品IDが自動採番され、同時にAmazon側へも自動的に反映されます。</p>

    <form id="createProductForm" method="post" th:action="@{'/products/new/' + ${category}}" th:object="${createProductRequest}">
        <label>商品名</label>
        <input type="text" th:field="*{name}">
        <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

        <label>価格(円)</label>
        <input type="number" th:field="*{price}">
        <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>

        <label>在庫数</label>
        <input type="number" th:field="*{stock}">
        <p class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>

        <!-- カテゴリはURLで確定しているため、ユーザーには選ばせず隠しフィールドで送るだけ -->
        <input type="hidden" th:field="*{category}">

        <!-- ノートPC/デスクトップPCの場合のみスペック項目を表示する -->
        <div class="spec-fields" th:if="${category.name() == 'LAPTOP' || category.name() == 'DESKTOP'}">
            <label>RAM(GB)</label>
            <input type="number" th:field="*{ramGb}">

            <label>SSD(GB)</label>
            <input type="number" th:field="*{ssdGb}">

            <label>CPUメーカー</label>
            <select th:field="*{cpuMaker}">
                <option value="">-- 未選択 --</option>
                <option value="INTEL">Intel</option>
                <option value="AMD">AMD</option>
            </select>

            <!-- GPU有無はデスクトップの場合のみ意味を持つため、デスクトップの時だけ表示する -->
            <label th:if="${category.name() == 'DESKTOP'}">
                <input type="checkbox" th:field="*{hasGpu}" style="width:auto; display:inline;"> GPU搭載
            </label>
        </div>

        <input type="hidden" id="idempotencyKey" th:field="*{idempotencyKey}">

        <button id="submitButton" type="submit">登録する</button>
    </form>

    <p><a th:href="@{/products/new}">カテゴリ選択へ戻る</a> | <a th:href="@{/products}">商品一覧へ戻る</a></p>
</div>

<script>
    document.getElementById('idempotencyKey').value = crypto.randomUUID();

    document.getElementById('createProductForm').addEventListener('submit', function () {
        document.getElementById('submitButton').disabled = true;
    });
</script>
</body>
</html>
